domain: magic
mode: sfx
formula: "texture + motion + pitch direction + tail + duration"
core_rule: >
  Describe the physics of the sound, not the concept. "Magical spell" alone
  gets a generic stock result — the model needs acoustic ingredients.
  "Magical" is fine as a modifier ("magical shimmer"), weak as the whole
  prompt.

vocabulary:
  texture: [shimmer, glassy chimes, granular sparkle, crystalline tinkles, airy whoosh, ethereal crackle, warm hum, choral pad]
  motion: [rising sweep, swell, burst, bloom, reversed whoosh into impact, doppler]
  pitch: [ascending glissando, pitch rise, deep sub drop]
  tail: [long reverb bloom, soft bell decay, fading sparkle trail]

entries:
  - id: spell-cast
    want: "spell cast"
    prompt: "bright glassy shimmer with ascending chimes, airy whoosh, soft bell tail"
    endpoint: text_to_sfx
    duration_hint: "1.5–3 s"
    tags: [magic, cast, bright]

  - id: dark-magic
    want: "dark magic"
    prompt: "low sub rumble, reversed whoosh into deep metallic impact, long dark reverb tail"
    endpoint: text_to_sfx
    duration_hint: "1.5–3 s"
    tags: [magic, dark, impact]

  - id: healing-glow
    want: "healing glow"
    prompt: "warm swelling pad, gentle wind chimes, soft harp glissando upward, airy sparkle decay"
    endpoint: text_to_sfx
    duration_hint: "2–4 s"
    tags: [magic, warm, heal]

  - id: portal-open
    want: "portal open"
    prompt: "deep whoosh, electric hum, crackling energy, rising sweep into reverb bloom"
    endpoint: text_to_sfx
    duration_hint: "2–4 s"
    tags: [magic, portal, energy]

  - id: transformation
    want: "transformation"
    prompt: "granular sparkle texture, fast pitch rise, resolving crystalline hit"
    endpoint: text_to_sfx
    duration_hint: "1.5–3 s"
    tags: [magic, transform, sparkle]

  - id: fairy-dust
    want: "fairy dust"
    prompt: "delicate high tinkles, fluttering shimmer, short sparkle trail"
    endpoint: text_to_sfx
    duration_hint: "1.5–2.5 s"
    tags: [magic, light, delicate]

tips:
  - "One sound event per call. 'Spell cast then explosion' = muddy result; make two calls and layer in the edit."
  - "Set duration to the event: short (1.5–3 s) for hits and casts, longer only for ambience."
  - "'Magical' works as a modifier ('magical shimmer'), not as the whole prompt."
  - "Onomatopoeia helps: whoosh, zing, fwoosh, chime."
